<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="PyQt6 Packaging Research: how eight real desktop applications package themselves on Windows, Linux and macOS, and the five artifacts produced by a GitHub Actions workflow">
  <title>PyQt6 Packaging Research</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f18"/>
      <stop offset="0.55" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#131d2b"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1d2a3c"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#38bdf8" opacity="0.7"/>

  <!-- left: identity -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-size="12.5" letter-spacing="2.6" fill="#6ea8fe" font-weight="600">RESEARCH &#183; PACKAGING &#183; 2026</text>

    <text x="62" y="147" font-size="45" font-weight="700" fill="#f2f7fd">PyQt6 Packaging<tspan fill="#38bdf8">&#160;Research</tspan></text>

    <text x="64" y="189" font-size="16.5" fill="#a3b4c8">How eight real desktop applications package themselves on Windows,</text>
    <text x="64" y="213" font-size="16.5" fill="#a3b4c8">Linux and macOS &#8212; every claim pinned to a commit.</text>

    <!-- artifact chips -->
    <g font-size="13" font-weight="600">
      <rect x="64"  y="248" width="96" height="32" rx="16" fill="#132033" stroke="#27394f"/>
      <text x="112" y="269" text-anchor="middle" fill="#cfe0f2">AppImage</text>

      <rect x="170" y="248" width="70" height="32" rx="16" fill="#132033" stroke="#27394f"/>
      <text x="205" y="269" text-anchor="middle" fill="#cfe0f2">.deb</text>

      <rect x="250" y="248" width="112" height="32" rx="16" fill="#132033" stroke="#27394f"/>
      <text x="306" y="269" text-anchor="middle" fill="#cfe0f2">macOS .zip</text>

      <rect x="372" y="248" width="126" height="32" rx="16" fill="#132033" stroke="#27394f"/>
      <text x="435" y="269" text-anchor="middle" fill="#cfe0f2">Windows .zip</text>

      <rect x="508" y="248" width="104" height="32" rx="16" fill="#132033" stroke="#27394f"/>
      <text x="560" y="269" text-anchor="middle" fill="#cfe0f2">NSIS .exe</text>
    </g>

    <text x="64" y="336" font-size="12" fill="#5b6b80">github.com/wachin/pyqt6-packaging-research</text>
  </g>

  <!-- right: the pipeline -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="700" y="84" font-size="11.5" letter-spacing="2.2" fill="#6b7a8d" font-weight="600">BUILT BY GITHUB ACTIONS</text>

    <!-- Windows -->
    <rect x="700" y="104" width="436" height="68" rx="12" fill="#101926" stroke="#1e2b3d"/>
    <rect x="700" y="116" width="4"  height="44" rx="2" fill="#4d9cf7"/>
    <text x="722" y="131" font-size="15.5" font-weight="700" fill="#eaf2fb">Windows 10 / 11</text>
    <text x="722" y="152" font-size="12.5" fill="#8fa3b8">Nuitka &#45;&#45;standalone</text>
    <text x="1114" y="141" font-size="12.5" text-anchor="end" fill="#b8c7d8">portable .zip &#183; setup.exe</text>

    <!-- macOS -->
    <rect x="700" y="184" width="436" height="68" rx="12" fill="#101926" stroke="#1e2b3d"/>
    <rect x="700" y="196" width="4"  height="44" rx="2" fill="#c9d1d9"/>
    <text x="722" y="211" font-size="15.5" font-weight="700" fill="#eaf2fb">macOS</text>
    <text x="722" y="232" font-size="12.5" fill="#8fa3b8">PyInstaller -D + BUNDLE</text>
    <text x="1114" y="221" font-size="12.5" text-anchor="end" fill="#b8c7d8">portable .zip (ditto)</text>

    <!-- Linux -->
    <rect x="700" y="264" width="436" height="68" rx="12" fill="#101926" stroke="#1e2b3d"/>
    <rect x="700" y="276" width="4"  height="44" rx="2" fill="#f7c948"/>
    <text x="722" y="291" font-size="15.5" font-weight="700" fill="#eaf2fb">Ubuntu / Debian</text>
    <text x="722" y="312" font-size="12.5" fill="#8fa3b8">PyInstaller onedir + debhelper</text>
    <text x="1114" y="301" font-size="12.5" text-anchor="end" fill="#b8c7d8">AppImage &#183; .deb</text>
  </g>
</svg>
