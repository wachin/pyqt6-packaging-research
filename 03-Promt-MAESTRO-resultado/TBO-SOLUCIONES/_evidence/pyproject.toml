[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbo"
version = "2.0.0.dev0"
description = "A modern comic editor compatible with legacy TBO documents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "COPYING" }
authors = [
    { name = "Washington Indacochea Delgado", email = "linuxfrontier@proton.me" },
]
keywords = ["comics", "comic-editor", "pyqt6", "tbo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = ["PyQt6>=6.6"]

[project.urls]
Homepage = "https://github.com/wachin/TBO"
Documentation = "https://github.com/wachin/TBO/blob/master/ROADMAP.md"
Source = "https://github.com/wachin/TBO"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.9",
    "hypothesis>=6.0",
]

[project.scripts]
tbo = "tbo.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tbo" = ["resources/*.svg", "resources/*.png", "resources/icons/*.svg", "resources/icons/NOTICE", "translations/*.qm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/tbo"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
