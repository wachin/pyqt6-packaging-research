name: Build executables

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python3 -m pip install build
      - name: Build wheel and sdist
        run: python3 -m build
      - uses: actions/upload-artifact@v5
        with:
          name: wheel-sdist
          path: dist/*

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Debian build dependencies (system packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python \
            pybuild-plugin-pyproject python3-setuptools python3-build python3-installer \
            python3-pil
      - name: Install Python build tooling into the active interpreter
        run: python3 -m pip install build setuptools wheel Pillow
      - name: Build .deb
        run: |
          dpkg-buildpackage -b -uc -us
          # dpkg-buildpackage writes the .deb/.buildinfo/.changes to the PARENT
          # directory of the source tree; move them into the workspace so the
          # upload-artifact step can find them.
          mv ../tbo_*.deb ../tbo_*.buildinfo ../tbo_*.changes ./
      - uses: actions/upload-artifact@v5
        with:
          name: debian
          path: |
            tbo_*.deb
            tbo_*.buildinfo
            tbo_*.changes

  # build-flatpak is DISABLED: the Docker image ghcr.io/flathub/flathub-infra:latest
  # is no longer publicly accessible. Re-enable only when a working image is identified.
  # See https://github.com/wachin/TBO/issues (flatpak not important for this project).
  # build-flatpak:
  #   runs-on: ubuntu-latest
  #   container:
  #     image: ghcr.io/flathub/flathub-infra:latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: Build Flatpak
  #       run: |
  #         cd packaging
  #         flatpak-builder build-dir org.tbo.TBO.json --force-clean
  #     - name: Export bundle
  #       run: |
  #         flatpak build-export export-repo packaging/build-dir
  #         flatpak build-bundle export-repo org.tbo.TBO.flatpak org.tbo.TBO
  #     - uses: actions/upload-artifact@v5
  #       with:
  #         name: flatpak
  #         path: org.tbo.TBO.flatpak

  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r packaging/requirements-linux.txt
      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3
      - name: Build AppImage
        run: |
          bash packaging/build_appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: tbo-linux-appimage
          path: build/output/TBO-*-x86_64.AppImage

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-windows.txt

      - name: Build standalone executable with Nuitka
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows_nuitka.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v5
        with:
          name: tbo-windows
          path: |
            build/output/TBO-*-Windows-x64-portable.zip
            build/dist/TBO/TBO.exe

  # Builds the same application with the other freezer, in both bundle layouts,
  # so the two can be compared on the same binaries. Upload each .exe to
  # VirusTotal and record the result; nothing here assumes which one fares
  # better. The Nuitka build above remains the shipping Windows artifact.
  build-windows-pyinstaller:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies (PyInstaller toolchain)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-windows-pyinstaller.txt

      - name: Build Windows executables with PyInstaller (onedir + onefile)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows_pyinstaller.ps1 -Mode both

      - name: Upload PyInstaller artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tbo-windows-pyinstaller
          path: |
            build/output/TBO-*-Windows-x64-pyinstaller-*.zip
            build/output/TBO-*-pyinstaller-windows.json
            build/dist/tbo-pyinstaller-onedir/tbo-pyinstaller-onedir.exe
            build/dist/tbo-pyinstaller-onefile.exe

  # Same application, same flags, but PyInstaller's bootloader is compiled from
  # source instead of using the pre-compiled stub that ships in the wheel and is
  # therefore shared with thousands of unrelated executables. PyInstaller
  # documents this as a way to avoid antivirus false positives:
  #   https://pyinstaller.org/en/stable/bootloader-building.html
  #
  # This is a measurement arm, not a shipping build. Scan its .exe alongside the
  # other two and record the result; whether it actually drops the detection
  # count is not established by any evidence in this repository yet.
  build-windows-pyinstaller-rebuilt-bootloader:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller built from source, with a freshly compiled bootloader
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-windows-pyinstaller.txt

          # Every line here is load-bearing, and two of them are easy to drop by
          # mistake:
          #
          #   uninstall       - an existing copy would simply be kept.
          #   cache remove    - pip would rebuild from its cached wheel and the
          #                     bootloader would never recompile.
          #   --no-binary     - forces the sdist instead of the wheel.
          #   COMPILE_BOOTLOADER - the one that actually matters on Windows.
          #
          # Measured with PyInstaller 6.22.3: the sdist's pre-compiled
          # Windows-64bit-intel/run.exe is BYTE-IDENTICAL to the wheel's
          # (sha256 581ea23e..., 311808 bytes). So --no-binary alone changes
          # nothing on Windows - pip would reuse the same stub every other
          # application uses. Only PYINSTALLER_COMPILE_BOOTLOADER forces the
          # compile. On Linux the sdist carries no pre-built bootloader for the
          # platform, so it compiles anyway and the flag looks redundant there.
          python -m pip uninstall -y PyInstaller
          python -m pip cache remove PyInstaller
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          # Same constraint as requirements-windows-pyinstaller.txt, so the two
          # PyInstaller arms differ only in where the bootloader came from.
          python -m pip install --verbose --no-binary=PyInstaller "pyinstaller>=6.0"

      - name: Confirm the bootloader was actually rebuilt
        shell: pwsh
        # A silent fall-back to the pre-built wheel would make this arm a
        # duplicate of the one above, which is worse than a failed job.
        run: |
          python -m pip show -f PyInstaller | Select-String -Pattern 'bootloader' | Select-Object -First 5
          python -c "import PyInstaller, pathlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader'; print('bootloader dir:', p); print(sorted(x.name for x in p.iterdir()))"

      - name: Build Windows executables with the rebuilt bootloader
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows_pyinstaller.ps1 -Mode both -Flavour pyinstaller-rebuilt

      - name: Upload rebuilt-bootloader artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tbo-windows-pyinstaller-rebuilt-bootloader
          path: |
            build/output/TBO-*-Windows-x64-pyinstaller-rebuilt-*.zip
            build/output/TBO-*-pyinstaller-rebuilt-windows.json
            build/dist/tbo-pyinstaller-rebuilt-onedir/tbo-pyinstaller-rebuilt-onedir.exe
            build/dist/tbo-pyinstaller-rebuilt-onefile.exe

  build-macos:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r packaging/requirements-macos.txt

      - name: Build macOS app with PyInstaller
        run: |
          bash packaging/build_macos.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v5
        with:
          name: tbo-macos
          path: build/output/TBO-*-macOS-x64.zip
